apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  type: NodePort #외부접속 위해 사용
  ports:
  - port: 3306
    nodePort: 30036
  selector:
    app: mysql # statefulset > spec.template.metadata.labels.app: ? 대상 연결
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: "mysql-service"
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql-container
        image: mysql:8.0
        args: ["--lower_case_table_names=1"]
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword"
        - name: MYSQL_DATABASE
          value: "msa_db"
        ports:
        - containerPort: 3306 
        volumeMounts:
        - name: mysql-data # volumeClaimTemplates.metadata.name : mysql-data 연결
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi