server:
  port: 8888

spring:
  profiles:
    active: native
  application:
    name: config-server
  security:
    basic:
      enabled: true
    user:
      name: root
      password: rootpassword
  cloud:
    config:
      server:
        native:
          search-locations: file:///D:/server-yml/

management:
  endpoints:
    web:
      exposure:
        include: '*'
  Prometheus:
    metrics:
      export:
        enabled: true

value:
  security:
    allow-ip-list: 127.0.0.1, 192.168.1.128, 192.168.1.101, 192.168.1.102