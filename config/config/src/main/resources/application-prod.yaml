server:
  port: 8888

spring:
  application:
    name: config-server
  security:
    basic:
      enabled: true
    user:
      name: root
      password: rootpassword
  cloud:
    config:
      server:
        git:
          uri: https://github.com/E-HAS/SpringBoot-MSA-Config-Repo
          default-label: main

management:
  endpoints:
    web:
      exposure:
        include: '*'
  Prometheus:
    metrics:
      export:
        enabled: true

value:
  security:
    allow-ip-list: 127.0.0.1, 192.168.1.128, 192.168.1.101, 192.168.1.102