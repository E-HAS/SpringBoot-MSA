name: MSA Auto Build & Deploy to K8s

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. 어떤 폴더(서버)의 코드가 수정되었는지 감지
  changes:
    runs-on: self-hosted # 맥미니 Self-hosted Runner 사용
    outputs:
      config: ${{ steps.filter.outputs.config }}
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            config:
              - 'config/**'
            gateway:
              - 'gateway/**'
            auth:
              - 'auth/**'

  # 2. 변경된 서비스만 병렬(Matrix)로 빌드 및 K8s 배포 실행
  build-and-deploy:
    needs: changes
    if: ${{ needs.changes.outputs.config == 'true' || needs.changes.outputs.gateway == 'true' || needs.changes.outputs.auth == 'true' }}
    runs-on: self-hosted
    strategy:
      matrix:
        include:
          - service: config
            image_name: config-server
            deploy_name: config-server
            enabled: ${{ needs.changes.outputs.config }}
          - service: gateway
            image_name: gateway-server
            deploy_name: gateway-server
            enabled: ${{ needs.changes.outputs.gateway }}
          - service: auth
            image_name: auth-server
            deploy_name: auth-server
            enabled: ${{ needs.changes.outputs.auth }}

    steps:
      - name: 1. 소스 코드 체크아웃
        if: matrix.enabled == 'true'
        uses: actions/checkout@v4

      - name: 2. JDK 17 설정
        if: matrix.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. ${{ matrix.service }} Gradle 빌드
        if: matrix.enabled == 'true'
        working-directory: ./${{ matrix.service }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test

      - name: 4. Docker Hub 로그인
        if: matrix.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. Docker 이미지 빌드 및 푸시 (${{ matrix.image_name }})
        if: matrix.enabled == 'true'
        working-directory: ./${{ matrix.service }}
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }} \
                       -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:latest

      - name: 6. K8s 무중단 롤링 업데이트 (${{ matrix.deploy_name }})
        if: matrix.enabled == 'true'
        run: |
          kubectl set image deployment/${{ matrix.deploy_name }} \
            ${{ matrix.deploy_name }}=${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_name }}:${{ github.sha }}
          kubectl rollout status deployment/${{ matrix.deploy_name }}